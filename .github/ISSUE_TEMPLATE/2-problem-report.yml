name: Problem report / 問題回報
description: Crash, slicing error or wrong behaviour of the test build / 測試版當機、切片失敗或行為錯誤
title: "[Problem] <short description>"
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Please first check whether the problem also happens with the main checkbox **off**, or in the official v2.5.0-alpha. If it does, it is not caused by this feature; please report it to OrcaSlicer instead.
        請先確認主開關**關閉**時、或官方 v2.5.0-alpha 是否也有同樣問題。如果有，就不是這個功能造成的，請回報給 OrcaSlicer 官方。

  - type: input
    id: build
    attributes:
      label: Test build / 測試版版本
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system / 作業系統
      options: [Windows, macOS, Linux]
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem / 問題類型
      options:
        - Crash / 當機
        - Slicing fails / 切片失敗
        - Wrong layers switched, or none / 切換的層不對，或完全沒切換
        - Feature off differs from official / 關閉時和官方結果不同
        - Settings panel / 設定介面
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: with_feature_off
    attributes:
      label: With the main checkbox off / 主開關關閉時
      options: [The problem is gone / 問題消失, The problem stays / 問題仍在, Not tried / 沒有試]
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1. Open the attached project
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened / 預期結果與實際結果
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Project and logs / 專案與記錄檔
      description: |
        A zip with the project 3MF, and for crashes the files in data_dir/log (Windows/macOS portable setup) or your --datadir/log folder.
        一個 zip：專案 3MF，當機時請附上 data_dir/log（或 --datadir 指定資料夾裡的 log）中的檔案。
    validations:
      required: true
